
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitcoin Live Price</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #10131c;
  color: #ffffff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 500px;
  background: #1a1e2b;
  border: 1px solid #303545;
  border-radius: 22px;
  padding: 30px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 35px;
}

.logo-area {
  display: flex;
  align-items: center;
  gap: 13px;
}

.logo {
  width: 50px;
  height: 50px;
  background: #f7931a;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 30px;
  font-weight: bold;
}

h1 {
  margin: 0 0 6px;
  font-size: 21px;
}

.subtitle {
  font-size: 12px;
  color: #9ca3b5;
}

.connection {
  font-size: 11px;
  padding: 8px 11px;
  border-radius: 20px;
  background: #343a49;
  color: #c3c8d4;
}

.connection.connected {
  background: #173b30;
  color: #62dda6;
}

.connection.disconnected {
  background: #49262c;
  color: #ff8585;
}

.label {
  font-size: 14px;
  color: #aab1c3;
}

.price {
  font-size: clamp(30px, 8vw, 39px);
  font-weight: bold;
  margin: 14px 0;
  overflow-wrap: anywhere;
  transition: color 0.2s;
}

.change {
  font-size: 15px;
  margin-bottom: 30px;
}

.up {
  color: #ff737d;
}

.down {
  color: #6ea8ff;
}

.neutral {
  color: #b0b6c5;
}

.divider {
  height: 1px;
  background: #303545;
  margin-bottom: 23px;
}

.details {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 25px;
}

.detail {
  background: #252b3b;
  border-radius: 13px;
  padding: 17px;
}

.detail-label {
  font-size: 12px;
  color: #9ca3b5;
  margin-bottom: 11px;
}

.detail-value {
  font-size: 16px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.footer {
  text-align: center;
  color: #929bad;
  font-size: 12px;
  line-height: 1.8;
}

@media (max-width: 380px) {
  .container {
    padding: 20px;
  }

  .connection {
    font-size: 10px;
    padding: 7px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo-area">
      <div class="logo">₿</div>
      <div>
        <h1>Bitcoin Live</h1>
        <div class="subtitle">UPBIT · KRW-BTC</div>
      </div>
    </div>

    <div class="connection" id="connection">
      연결 중
    </div>
  </div>

  <div class="label">비트코인 현재가</div>

  <div class="price" id="price">
    데이터 수신 대기 중
  </div>

  <div class="change neutral" id="change">
    업비트 실시간 시세 연결 중
  </div>

  <div class="divider"></div>

  <div class="details">

    <div class="detail">
      <div class="detail-label">오늘의 고가</div>
      <div class="detail-value" id="high">-</div>
    </div>

    <div class="detail">
      <div class="detail-label">오늘의 저가</div>
      <div class="detail-value" id="low">-</div>
    </div>

    <div class="detail">
      <div class="detail-label">전일 종가</div>
      <div class="detail-value" id="previous">-</div>
    </div>

    <div class="detail">
      <div class="detail-label">24시간 거래대금</div>
      <div class="detail-value" id="volume">-</div>
    </div>

  </div>

  <div class="footer">
    <div id="status">업비트 WebSocket 연결 준비 중</div>
    <div id="updated">마지막 업데이트: -</div>
    <div>Data provided by Upbit</div>
  </div>

</div>

<script>
const SOCKET_URL = "wss://api.upbit.com/websocket/v1";

let socket = null;
let reconnectTimer = null;
let reconnectDelay = 1000;
let manuallyClosed = false;

const numberFormat = new Intl.NumberFormat("ko-KR", {
  maximumFractionDigits: 0
});

function formatWon(value) {
  return numberFormat.format(value) + "원";
}

function setConnection(state, message) {
  const element = document.getElementById("connection");

  element.textContent = message;
  element.className = "connection " + state;
}

function updatePrice(data) {
  const price = data.trade_price;
  const change = data.signed_change_price;
  const rate = data.signed_change_rate * 100;

  document.getElementById("price").textContent =
    formatWon(price);

  const changeElement = document.getElementById("change");

  changeElement.className = "change";

  let symbol = "";

  if (change > 0) {
    changeElement.classList.add("up");
    symbol = "▲ ";
  } else if (change < 0) {
    changeElement.classList.add("down");
    symbol = "▼ ";
  } else {
    changeElement.classList.add("neutral");
  }

  changeElement.textContent =
    symbol +
    formatWon(Math.abs(change)) +
    " (" +
    (rate > 0 ? "+" : "") +
    rate.toFixed(2) +
    "%) · 전일 대비";

  document.getElementById("high").textContent =
    formatWon(data.high_price);

  document.getElementById("low").textContent =
    formatWon(data.low_price);

  document.getElementById("previous").textContent =
    formatWon(data.prev_closing_price);

  document.getElementById("volume").textContent =
    formatWon(data.acc_trade_price_24h);

  const now = new Date();

  document.getElementById("updated").textContent =
    "마지막 업데이트: " +
    now.toLocaleTimeString("ko-KR");

  document.getElementById("status").textContent =
    "실시간 시세 데이터 수신 중";

  setConnection("connected", "● 연결됨");
}

function connectUpbit() {
  if (manuallyClosed) return;

  clearTimeout(reconnectTimer);

  document.getElementById("status").textContent =
    "업비트 서버 연결 중...";

  setConnection("", "연결 중");

  socket = new WebSocket(SOCKET_URL);

  socket.onopen = function() {
    reconnectDelay = 1000;

    const request = [
      {
        ticket: "bitcoin-live-monitor"
      },
      {
        type: "ticker",
        codes: ["KRW-BTC"]
      },
      {
        format: "DEFAULT"
      }
    ];

    socket.send(JSON.stringify(request));

    document.getElementById("status").textContent =
      "구독 요청 완료 · 데이터 대기 중";
  };

  socket.onmessage = async function(event) {
    try {
      let message;

      if (event.data instanceof Blob) {
        message = await event.data.text();
      } else if (event.data instanceof ArrayBuffer) {
        message = new TextDecoder().decode(event.data);
      } else {
        message = event.data;
      }

      const data = JSON.parse(message);

      if (data.error) {
        throw new Error(data.error.message || "API 오류");
      }

      if (data.type === "ticker" && data.code === "KRW-BTC") {
        updatePrice(data);
      }

    } catch (error) {
      console.error("데이터 처리 오류:", error);
      document.getElementById("status").textContent =
        "데이터 처리 오류: " + error.message;
    }
  };

  socket.onerror = function(error) {
    console.error("WebSocket 오류:", error);

    document.getElementById("status").textContent =
      "연결 오류 발생";
  };

  socket.onclose = function() {
    if (manuallyClosed) return;

    setConnection("disconnected", "● 연결 끊김");

    document.getElementById("status").textContent =
      "연결이 끊어졌습니다. 재연결 시도 중...";

    reconnectTimer = setTimeout(function() {
      reconnectDelay = Math.min(reconnectDelay * 2, 30000);
      connectUpbit();
    }, reconnectDelay);
  };
}

window.addEventListener("online", function() {
  if (!socket || socket.readyState === WebSocket.CLOSED) {
    reconnectDelay = 1000;
    connectUpbit();
  }
});

window.addEventListener("beforeunload", function() {
  manuallyClosed = true;
  clearTimeout(reconnectTimer);

  if (socket) {
    socket.close();
  }
});

connectUpbit();
</script>

</body>
</html>
